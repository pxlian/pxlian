name: Update profile statistics

on:
  push:
    branches: [main, master]
    paths:
      - README.md
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate public activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=pxlian&show_icons=true&hide_rank=true&title_color=024282&icon_color=024282&text_color=334155&bg_color=ffffff&border_color=d1d9e0&custom_title=GitHub%20Activity&disable_animations=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate public repository languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=pxlian&layout=compact&langs_count=6&title_color=024282&text_color=334155&bg_color=ffffff&border_color=d1d9e0&custom_title=Repository%20Languages&disable_animations=true
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public profile statistics"
          git push
